services:
  backend:
    build: ./backend
    container_name: ticketline-backend
    environment:
      SPRING_PROFILES_ACTIVE: generateData
    ports:
      - "8080:8080"
    volumes:
      - backend-database:/app/database
      - backend-logs:/app/log
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: ticketline-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  backend-database:
  backend-logs: