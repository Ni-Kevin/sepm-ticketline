<section class="hero">
</section>

<div class="container app-page app-page--form">
  <app-page-header
    title="Set a new password">
  </app-page-header>

  @if (errorMessages.length > 0) {
    <app-alert-message type="warning" class="mb-3">
      {{ errorMessages }}<br>
    </app-alert-message>
  }
  @if (successMessage) {
    <app-alert-message type="success" class="mb-3">
      {{ successMessage }}<br>
    </app-alert-message>
  }


  <div class="card shadow-sm border-0 app-section-card">
    <div class="card-body p-4">

      <form [formGroup]="resetForm" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label app-form-label">New Password</label>
          <input id="password" type="password" class="form-control custom-input" formControlName="password">
          @if (fieldErrors['password']) {
            <small class="text-danger">{{ fieldErrors['password'] }}</small>
          }
        </div>

        <div class="mb-3">
          <label class="form-label app-form-label">Confirm Password</label>
          <input id="confirmPassword" type="password" class="form-control custom-input" formControlName="confirmPassword">
          @if (fieldErrors['confirmPassword']) {
            <small class="text-danger">{{ fieldErrors['confirmPassword'] }}</small>
          }
        </div>

        <button type="submit" class="btn app-btn-primary w-100">Reset password</button>
      </form>
    </div>
  </div>
</div>
