<section class="container app-page py-4">
  <div class="mb-4">
    <a routerLink="/news" class="btn app-btn-outline btn">
      ← Back to News
    </a>
  </div>

  @if (errorMessage) {
    <app-alert-message type="danger" class="mb-3">{{ errorMessage }}</app-alert-message>
  }

  <div class="news-detail-container card p-4 shadow-sm">
    <div class="detail-header mb-3">
      <h2 class="fw-bold mb-1">{{ currentNews.title }}</h2>
      <p class="text-muted small">{{ formatPublishedAt(currentNews.publishedAt) }}</p>
    </div>

    <div class="detail-body">
      @if (imageSrc(currentNews); as imageSrc) {
        <img class="img-fluid w-100 rounded mb-4" [src]="imageSrc" alt="News image" style="max-height: 450px; object-fit: cover;">
      }

      <div class="news-summary fw-semibold fs-5 mb-3">{{ currentNews.summary }}</div>

      @if (currentNews.text) {
        <p class="news-text whitespace-preline text-secondary">{{ currentNews.text }}</p>
      }
    </div>
  </div>
</section>
