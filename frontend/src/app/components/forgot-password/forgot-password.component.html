<section class="hero">
</section>

<div class="container app-page app-page--form">

  <app-page-header
    title="Reset Password">
  </app-page-header>

  @if (errorMessage) {
    <app-alert-message type="warning" class="mb-3">
      {{ errorMessage }}<br>
    </app-alert-message>
  }
  @if (successMessage) {
    <app-alert-message type="success" class="mb-3">
      {{ successMessage }}<br>
    </app-alert-message>
  }

  <div class="card shadow-sm border-0 app-section-card">
    <div class="card-body p-4">

      <form [formGroup]="requestForm" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label app-form-label">Email</label>
          <input id="email" type="email" class="form-control custom-input" formControlName="email">
          @if (fieldErrors['email']) {
            <small class="text-danger">{{ fieldErrors['email'] }}</small>
          }
        </div>

        <button type="submit" class="btn app-btn-primary w-100">Send reset link</button>
      </form>
    </div>
  </div>
</div>
