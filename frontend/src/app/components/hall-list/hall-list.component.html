<section class="hero">
</section>

<div class="container app-page">
  <app-page-header
    title="Halls"
    subtitle="Manage individual halls and configurations within venues.">
    <a actions class="btn app-btn-primary" routerLink="/admin/halls/create">Create hall</a>
  </app-page-header>

  @if (error) {
    <app-alert-message type="danger">{{ errorMessage }}</app-alert-message>
  }

  <div class="row mb-4">
    <div class="col-md-4">
      <div class="input-group shadow-sm">
        <span class="input-group-text bg-white text-muted">Venue</span>
        <select class="form-select" (change)="onVenueFilterChange($any($event.target).value)">
          <option value="">All venues</option>
          @for (venue of venues; track venue.id) {
            <option [value]="venue.id">{{ venue.name }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0 app-section-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th class="ps-4 border-0">Name</th>
            <th class="border-0">Venue</th>
            <th class="border-0">Dimensions</th>
            <th class="text-end pe-4 border-0">Actions</th>
          </tr>
          </thead>
          <tbody>
            @for (hall of paginatedHalls; track hall.id) {
              <tr>
                <td class="ps-4 fw-medium">{{ hall.name }}</td>
                <td>
                  <span class="badge bg-light text-dark border">{{ hall.venueName }}</span>
                </td>
                <td class="text-muted small">
                  {{ hall.width }}m &times; {{ hall.length }}m
                </td>
                <td class="text-end pe-4">
                  <a class="btn btn-sm btn-light border me-2" [routerLink]="['/admin/halls', hall.id, 'layout']">Layout</a>
                  <a class="btn btn-sm app-btn-outline" [routerLink]="['/admin/halls', hall.id, 'edit']">
                    Edit
                  </a>
                </td>
              </tr>
            }
            @if (halls.length === 0) {
              <tr>
                <td colspan="4" class="p-0">
                  <app-empty-state label="Hall" message="No halls available yet."></app-empty-state>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    ariaLabel="Hall pagination"
    (pageChange)="onPageChanged($event)">
  </app-pagination>
</div>
